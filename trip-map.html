<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>España — the route</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍊</text></svg>">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<!-- Loaded synchronously so window.I18N exists before the inline script below. -->
<script src="i18n.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: var(--color-bg); font-family: var(--font-body); }
  #map { position: absolute; inset: 0; }
  .leaflet-tile { filter: sepia(.15) saturate(.88); }
  .panel {
    position: absolute; top: 16px; left: 16px; z-index: 1000;
    background: var(--color-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-md);
    padding: 16px 18px; width: 236px;
  }
  .panel h1 { font-family: var(--font-heading); font-weight: 400; font-size: 22px; margin: 0 0 2px; }
  .panel .sub { font-size: 12.5px; color: var(--color-neutral-700); margin: 0 0 12px; }
  .views { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .views .btn { font-size: 12.5px; padding: 6px 13px; }
  .legend { display: grid; gap: 8px; font-size: 13px; color: var(--color-neutral-800); }
  .legend .row { display: flex; align-items: center; gap: 9px; }
  .line { width: 20px; height: 0; border-top: 3px dashed var(--color-accent-600); flex-shrink: 0; }
  .line.solid { border-top-style: solid; border-top-color: var(--color-accent-2-600); }
  .pin {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(32,30,29,.35); box-sizing: border-box;
  }
  .pin svg { width: 14px; height: 14px; display: block; }
  .pin.sm { width: 21px; height: 21px; border-width: 2px; box-shadow: none; flex-shrink: 0; }
  .pin.sm svg { width: 11px; height: 11px; }
  .leaflet-popup-content-wrapper { background: var(--color-bg); color: var(--color-text); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); font-family: var(--font-body); }
  .leaflet-popup-tip { background: var(--color-bg); }
  .leaflet-popup-content { margin: 12px 16px; }
  .pop-title { font-family: var(--font-heading); font-size: 15px; margin: 0 0 2px; }
  .pop-meta { font-size: 12px; color: var(--color-neutral-700); margin: 0; }
  .spot-tip, .city-label {
    background: var(--color-text); color: #fff; border: none; border-radius: 999px;
    padding: 3px 12px; font-family: var(--font-body); font-weight: 700; font-size: 12px; box-shadow: var(--shadow-sm);
  }
  .spot-tip::before, .city-label::before { display: none; }
  .legend-wrap summary { list-style: none; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--color-neutral-700); display: none; padding: 2px 0; }
  .legend-wrap summary::-webkit-details-marker { display: none; }
  .map-lock { position: absolute; inset: 0; z-index: 1500; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 132px; }
  .map-lock span { background: var(--color-text); color: #fff; border-radius: 999px; padding: 9px 18px; font-size: 13.5px; font-weight: 700; box-shadow: var(--shadow-md); }
  @media (max-width: 640px) {
    .panel { top: auto; bottom: 12px; left: 12px; right: 12px; width: auto; padding: 12px 14px 10px; }
    .panel h1 { font-size: 18px; }
    .panel .sub { display: none; }
    .views { margin-bottom: 8px; }
    .views .btn { padding: 9px 15px; font-size: 13px; }
    .legend-wrap summary { display: block; }
    .legend { grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 12px; padding-top: 6px; }
    .pin { width: 36px; height: 36px; }
    .pin svg { width: 17px; height: 17px; }
    .pin.sm { width: 21px; height: 21px; }
    .pin.sm svg { width: 11px; height: 11px; }
    .city-label { font-size: 11px; padding: 2px 9px; }
    .spot-tip { display: none; }
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
  <h1 id="panelTitle">The route</h1>
  <p class="sub">Wigston → Barcelona → València<br><span id="panelDates">8-14 August</span></p>
  <div class="views">
    <button type="button" class="btn btn-primary" id="v-all">Full route</button>
    <button type="button" class="btn btn-secondary" id="v-bcn">Barcelona</button>
    <button type="button" class="btn btn-secondary" id="v-vlc">València</button>
  </div>
  <details class="legend-wrap" id="legendWrap">
    <summary id="legendLabel">Legend ▾</summary>
    <div class="legend" id="legend">
      <div class="row"><span class="line"></span> <span id="legFlight">Flight, 2h20</span></div>
      <div class="row"><span class="line solid"></span> <span id="legTrain">Coast train, 2h40</span></div>
    </div>
  </details>
</div>
<script>
  const css = getComputedStyle(document.documentElement);
  const tok = n => css.getPropertyValue(n).trim();

  // Words come from i18n.js; this file keeps only geometry and timings.
  const T = window.I18N.t.map;
  const DOWS = window.I18N.t.dows;
  const dayN = n => window.I18N.fmt(window.I18N.t.ui.dayN, { n });

  document.title = T.htmlTitle;
  document.getElementById('panelTitle').textContent = T.panelTitle;
  document.getElementById('panelDates').textContent = T.panelDates;
  document.getElementById('v-all').textContent = T.viewAll;
  document.getElementById('legendLabel').textContent = T.legendLabel;
  document.getElementById('legFlight').textContent = T.flight;
  document.getElementById('legTrain').textContent = T.train;

  const ICONS = {
    sights: '<line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/>',
    sea: '<path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>',
    food: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
    fiesta: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>'
  };
  const CAT = {
    sights: [tok('--color-accent'), T.catSights],
    sea:    [tok('--color-accent-2'), T.catSea],
    food:   [tok('--color-neutral-700'), T.catFood],
    fiesta: [tok('--color-accent-800'), T.catFiesta]
  };
  const pinHTML = (cat, sm) =>
    '<div class="pin' + (sm ? ' sm' : '') + '" style="background:' + CAT[cat][0] + '">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">' + ICONS[cat] + '</svg></div>';

  const legend = document.getElementById('legend');
  Object.keys(CAT).forEach(cat => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = pinHTML(cat, true) + ' ' + CAT[cat][1];
    legend.appendChild(row);
  });

  const small = matchMedia('(max-width: 640px)').matches;
  document.getElementById('legendWrap').open = !small;
  const map = L.map('map', { zoomControl: false });
  L.control.zoom({ position: small ? 'topright' : 'bottomright' }).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap contributors © CARTO', subdomains: 'abcd', maxZoom: 20
  }).addTo(map);

  const WIG = [52.581, -1.093], EMA = [52.831, -1.328], BCN = [41.387, 2.170], VLC = [39.470, -0.376];

  const arc = (a, b, bend) => {
    const pts = [];
    for (let i = 0; i <= 40; i++) {
      const t = i / 40;
      pts.push([a[0] + (b[0] - a[0]) * t + bend * Math.sin(Math.PI * t), a[1] + (b[1] - a[1]) * t]);
    }
    return pts;
  };
  L.polyline(arc(EMA, BCN, 1.6), { color: tok('--color-accent-600'), weight: 3, dashArray: '7 7' }).addTo(map);
  L.polyline([BCN, [41.118, 1.245], [40.65, 0.58], [39.986, -0.037], VLC], { color: tok('--color-accent-2-600'), weight: 3.5 }).addTo(map);
  L.polyline([WIG, EMA], { color: tok('--color-neutral-500'), weight: 2.5, dashArray: '2 6' }).addTo(map);

  const cityDot = (ll, label, longLabel, dir) => {
    L.circleMarker(ll, { radius: small ? 6 : 7, color: '#fff', weight: 2.5, fillColor: tok('--color-text'), fillOpacity: 1 }).addTo(map)
      .bindTooltip(small ? label : longLabel, { permanent: true, direction: dir || 'right', offset: dir === 'left' ? [-10, 0] : [10, 0], className: 'city-label' });
  };
  cityDot(WIG, 'Wigston', T.wigstonLong);
  cityDot(BCN, 'Barcelona', T.bcnLong, small ? 'left' : 'right');
  cityDot(VLC, 'València', T.vlcLong);

  // [lat, lng, cat, spot key, day number, time, also-on-day]
  const SPOTS = [
    [41.3839, 2.1760, 'sights', 'gothic', 1, '18:30'],
    [41.3799, 2.1745, 'food', 'merce', 1, '21:00'],
    [41.4036, 2.1744, 'sights', 'sagrada', 2, '09:00'],
    [41.4145, 2.1527, 'sights', 'guell', 2, '17:30'],
    [41.3917, 2.1650, 'fiesta', 'batllo', 2, '21:00'],
    [41.5931, 1.8371, 'sights', 'montserrat', 3, '10:00'],
    [41.3784, 2.1925, 'sea', 'barceloneta', 3, '18:00'],
    [41.3800, 2.1868, 'food', 'cansole', 3, '20:30'],
    [41.3853, 2.1794, 'food', 'caterina', 4, '09:00'],
    [41.3838, 2.1819, 'sights', 'delmar', 4, '09:45'],
    [41.3852, 2.1809, 'sights', 'picasso', 4, '10:30'],
    [41.3817, 2.1716, 'sights', 'rambla', 4, '12:15'],
    [39.4772, -0.3644, 'sights', 'turia', 4, '18:30', 7],
    [39.4630, -0.3760, 'food', 'russafa', 4, '21:00'],
    [39.4738, -0.3790, 'food', 'mercat', 5, '08:45'],
    [39.4745, -0.3785, 'sights', 'lonja', 5, '10:00'],
    [39.4757, -0.3754, 'sights', 'cathedral', 5, '11:30'],
    [39.4810, -0.3245, 'sea', 'malvarosa', 5, '17:30'],
    [39.4793, -0.3757, 'sights', 'serranos', 5, '20:45'],
    [39.4785, -0.3800, 'food', 'carmen', 5, '21:30'],
    [39.4548, -0.3505, 'sights', 'arts', 6, '09:00'],
    [39.4531, -0.3480, 'sights', 'ocean', 6, '10:30'],
    [39.3245, -0.3300, 'food', 'palmar', 6, '14:15'],
    [39.3355, -0.3355, 'sea', 'albufera', 6, '19:00']
  ];
  SPOTS.forEach(([lat, lng, cat, key, day, time, alsoDay]) => {
    const title = T.spots[key];
    const when = dayN(day) + ' · ' + DOWS[day - 1] + ' ' + time + (alsoDay ? ' + ' + dayN(alsoDay) : '');
    L.marker([lat, lng], {
      icon: L.divIcon({ className: '', html: pinHTML(cat), iconSize: [28, 28], iconAnchor: [14, 14] })
    }).addTo(map)
      .bindTooltip(title, { direction: 'top', offset: [0, -15], className: 'spot-tip' })
      .bindPopup('<p class="pop-title">' + title + '</p><p class="pop-meta">' + when + '</p>');
  });

  // The panel overlays the map, so keep the fitted bounds clear of it: on a
  // phone it sits along the bottom, on desktop it's inset from every edge.
  const fitOpts = p => matchMedia('(max-width: 640px)').matches
    ? { paddingTopLeft: [26, 26], paddingBottomRight: [26, 158] }
    : { padding: [p, p] };
  const VIEWS = {
    'v-all': [[WIG, BCN, VLC], 60],
    'v-bcn': [[[41.360, 2.148], [41.418, 2.196]], 46],
    'v-vlc': [[[39.320, -0.385], [39.485, -0.320]], 46]
  };
  let view = 'v-all';
  let explored = false;
  const btns = ['v-all', 'v-bcn', 'v-vlc'].map(id => document.getElementById(id));
  btns.forEach(b => b.addEventListener('click', () => {
    btns.forEach(x => x.className = 'btn btn-secondary');
    b.className = 'btn btn-primary';
    view = b.id;
    explored = false;
    map.flyToBounds(L.latLngBounds(VIEWS[view][0]), fitOpts(VIEWS[view][1]));
  }));
  const fit = () => map.fitBounds(L.latLngBounds(VIEWS[view][0]), fitOpts(VIEWS[view][1]));
  fit();
  // Embedded in an iframe, the first fit can land before the frame reaches
  // its final size — Leaflet would keep that zoom and simply paint more
  // world around it. Re-measure and re-fit whenever the box changes, until
  // the reader pans or zooms for themselves: after that a resize keeps
  // where they are instead of yanking them back to the fitted view.
  const frame = document.getElementById('map');
  ['pointerdown', 'wheel'].forEach(t =>
    frame.addEventListener(t, () => { explored = true; }, { passive: true }));
  new ResizeObserver(() => {
    map.invalidateSize({ animate: false });
    if (!explored) fit();
  }).observe(frame);

  // Embedded on a touch screen: lock the map until tapped, so page scrolling isn't hijacked
  if (window.self !== window.top && matchMedia('(pointer: coarse)').matches) {
    const lock = document.createElement('div');
    lock.className = 'map-lock';
    const label = document.createElement('span');
    label.textContent = T.lock;
    lock.appendChild(label);
    document.body.appendChild(lock);
    lock.addEventListener('click', () => lock.remove());
  }
</script>
</body>
</html>
